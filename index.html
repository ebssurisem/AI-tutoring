<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생각의 길</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gothic+A1:wght@400;600;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'RIDIBatang';src:url('fonts/RIDIBatang.woff2') format('woff2');font-display:swap}
/* VOICE: 다정하고 믿음직한 스승. 아이에게는 놀이, 부모에게는 차분한 기록.
   IDEA: 징검다리 '생각의 길' — 하루 한 칸씩 건너는 24개의 돌다리, 끝에는 내 발명품.
   PICTURE: 네 구역(궁금이·생각쟁이·해결사·발명가)을 굽이치는 징검다리 지도와 걷는 새싹 캐릭터.
   COLOUR and TYPE: 소나무 초록 바탕 띠 + 흰 종이 + 해바라기 노랑 포인트. 제목 Jua, 본문 Gothic A1.
   LAYOUT: 프로필 → 지도+오늘의 수업 → 대화 수업 → 정리 → 부모님 기록. 한 열, 휴대폰 우선. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0e1a15);--ink:light-dark(#14231c,#e9f2ec);--soft:light-dark(#5b6b63,#9fb3a8);
--pine:light-dark(#1f5a43,#2f7a5c);--pine2:light-dark(#e8f3ed,#15281f);--sun:#f6b81a;--sunInk:#3a2a00;
--line:light-dark(#d9e5de,#26392f);--card:light-dark(#ffffff,#13231b);--tutor:light-dark(#f2f7f4,#182d23);--kid:light-dark(#fff4d1,#3a3112)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Gothic A1",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.jua{font-family:Jua,"Gothic A1",sans-serif;font-weight:400;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(32px,6vw,48px)}h2{font-size:clamp(24px,4vw,32px)}h3{font-size:20px}
.band{padding:clamp(24px,4vw,56px) max(5vw,16px)}
.wrap{max-width:1000px;margin:0 auto}
.hero{background:var(--pine);color:#fff}
.hero p{color:#dcefe5;max-width:60ch;margin:10px 0 0}
button,select,input,textarea{font:inherit;font-size:16px}
.btn{min-height:44px;padding:10px 18px;border-radius:14px;border:2px solid transparent;cursor:pointer;font-weight:600;background:var(--pine);color:#fff}
.btn.sun{background:var(--sun);color:var(--sunInk)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--soft);font-size:14px}
.hidden{display:none!important}
/* 프로필 */
#vHome .hero{min-height:100dvh}
.profiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:16px;margin-top:24px}
.pcard{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:22px;padding:20px;cursor:pointer;text-align:left;display:grid;gap:10px;justify-items:start;min-height:200px}
.pcard:hover{border-color:var(--sun)}
.pcard .nm{font-family:Jua;font-size:28px}
.pcard.add{place-items:center;justify-items:center;text-align:center;border-style:dashed;color:var(--soft)}
.bar{height:10px;width:100%;background:var(--pine2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--sun)}
form.addf{display:grid;gap:12px;max-width:420px;background:var(--card);color:var(--ink);border-radius:22px;padding:20px;margin-top:20px}
label{font-weight:600;font-size:14px;display:grid;gap:6px}
input,select,textarea{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);color:var(--ink)}
.swatches{display:flex;gap:10px}.swatches button{width:44px;height:44px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.swatches button[aria-pressed=true]{border-color:var(--ink)}
/* 지도 */
.mapbox{background:var(--pine2);border-radius:24px;padding:12px;margin-top:20px}
.map{width:100%;height:auto;display:block}
.zones{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center;font-size:13px;color:var(--soft);padding:4px 0 2px}
.zones b{display:block;font-family:Jua;font-weight:400;font-size:17px;color:var(--ink)}
.today{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;margin-top:20px}
@media(max-width:700px){.today{grid-template-columns:1fr}.zones{font-size:11px}.zones b{font-size:14px}}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--pine2);color:var(--pine)}
:root[data-theme=dark] .tag{color:#bfe3d0}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .tag{color:#bfe3d0}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs .btn[aria-selected=true]{background:var(--pine);color:#fff;border-color:var(--pine)}
.memo{background:var(--kid);border-radius:16px;padding:14px 16px;margin-top:12px}
/* 수업 */
.lesson{display:grid;grid-template-rows:auto 1fr auto;height:100dvh;max-width:820px;margin:0 auto}
.lhead{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:2px solid var(--line)}
.lhead .t{flex:1}
.clock{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap;display:flex;align-items:center;gap:8px}
.ring{width:36px;height:36px}
.chat{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:86%;padding:12px 16px;border-radius:20px;white-space:pre-wrap;font-size:18px;line-height:1.7;word-break:keep-all;font-family:'RIDIBatang','Gothic A1',serif}
.msg .who{font-family:Jua,sans-serif}
.msg.a{background:var(--tutor);border-top-left-radius:6px;align-self:flex-start}
.msg.u{background:var(--kid);border-top-right-radius:6px;align-self:flex-end}
.msg .who{font-family:Jua;font-size:14px;color:var(--pine);display:flex;gap:8px;align-items:center;margin-bottom:2px}
:root[data-theme=dark] .msg .who{color:#9fd8bb}
.spk{border:0;background:transparent;cursor:pointer;padding:0 4px;color:inherit;min-height:28px}
.compose{border-top:2px solid var(--line);padding:10px 12px;display:grid;gap:8px}
.compose .row{flex-wrap:nowrap}
.compose textarea{flex:1;resize:none;height:52px}
.quick{display:flex;gap:8px;overflow-x:auto}
.quick .btn{flex:none}
.mic[aria-pressed=true]{background:#d9472b}
/* 기록 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px;margin:16px 0}
.stat{background:var(--pine2);border-radius:18px;padding:14px}
.stat b{display:block;font-family:Jua;font-weight:400;font-size:32px;font-variant-numeric:tabular-nums}
.log{display:grid;gap:12px}
.log .card p{margin:6px 0}
.log dt{font-weight:800;font-size:14px;color:var(--soft);margin-top:6px}.log dd{margin:0}
.dialog{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:9}
.dialog .card{max-width:380px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:10}
.sheet{max-width:820px;margin:0 auto;background:#fff;color:#14231c;border:2px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,40px)}
.sheet h1{font-size:30px;color:#1f5a43}.sheet h3{margin:22px 0 8px;font-size:19px;color:#1f5a43}
.sheet .muted{color:#5b6b63}.sheet ul{margin:0;padding-left:20px}.sheet li{margin:4px 0;break-inside:avoid}
.sheet .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:16px 0}
.sheet .kpi{background:#e8f3ed;border-radius:12px;padding:10px 12px}.sheet .kpi b{display:block;font-family:Jua;font-weight:400;font-size:26px}
.sheet .ask{background:#fff4d1;border-radius:12px;padding:12px 14px;margin-top:8px}
@media(max-width:520px){.sheet .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stage,.vctl{display:none}
.lesson.voice .chat{display:none}.lesson.voice .stage{display:grid}.lesson.voice .vctl{display:grid}
.lesson.voice #typeRow{display:none}.lesson.voice.typing #typeRow{display:flex}
.lesson.voice.showlog .chat{display:flex}.lesson.voice.showlog .stage{display:none}
.lesson:not(.voice) #typeBtn{display:none}
.stage{place-items:center;align-content:center;gap:12px;padding:10px 16px;overflow:auto}
.nare-wrap{position:relative;width:min(52vw,250px)}#nare{width:100%;height:auto;display:block}
#mouth,#eyes rect,.wing{transform-box:fill-box;transform-origin:center}
#eyes rect{animation:blink 4.5s infinite}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.12)}}
.stage.talking #mouth{animation:talk .18s ease-in-out infinite alternate}
@keyframes talk{to{transform:scaleY(2.8)}}
.stage.talking #nare{animation:bob 1.1s ease-in-out infinite}
.stage.talking .wing{animation:flap .6s ease-in-out infinite alternate}.stage.talking .wing.r{animation-direction:alternate-reverse}
@keyframes flap{to{transform:rotate(-8deg)}}
.stage.thinking .head{transform:rotate(-5deg);transform-origin:110px 136px;transition:transform .3s}
.dots{position:absolute;top:2%;right:-6%;display:none;gap:5px;background:var(--card);padding:9px 11px;border-radius:14px;border:2px solid var(--line)}
.stage.thinking .dots{display:flex}.dots i{width:8px;height:8px;border-radius:50%;background:var(--pine);animation:dot 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{opacity:.25}}
.stage.listening .nare-wrap::after{content:'듣고 있어요';position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);background:#e8613c;color:#fff;font-size:13px;font-weight:800;padding:4px 10px;border-radius:99px;white-space:nowrap}
.cap{word-break:keep-all;font-family:'RIDIBatang','Gothic A1',serif;font-size:clamp(19px,2.5vw,22px);line-height:1.75;max-width:640px;text-align:center;white-space:pre-wrap;background:var(--tutor);padding:14px 18px;border-radius:20px}
.cap:empty{display:none}.mine{text-align:center;min-height:1.4em;color:var(--soft);max-width:640px}
.vctl{justify-items:center}
.talk{width:104px;height:104px;border-radius:50%;border:0;background:var(--sun);color:var(--sunInk);font:inherit;font-weight:800;cursor:pointer;box-shadow:0 6px 0 #c9920f;margin-bottom:6px}
.talk:active{transform:translateY(3px);box-shadow:0 3px 0 #c9920f}.talk:focus-visible{outline:3px solid var(--pine);outline-offset:3px}
.talk[aria-pressed=true]{background:#e8613c;color:#fff;box-shadow:0 6px 0 #a63f20}.talk span{display:block;font-size:15px;padding:0 10px;line-height:1.25;word-break:keep-all}
@media(prefers-reduced-motion:reduce){#eyes rect,.stage.talking #mouth,.stage.talking #nare,.stage.talking .wing,.dots i{animation:none}}
.batt{display:flex;gap:4px;width:170px;height:42px;border:3px solid var(--ink);border-radius:10px;padding:4px;position:relative}
.batt::after{content:'';position:absolute;right:-10px;top:11px;width:6px;height:14px;background:var(--ink);border-radius:0 3px 3px 0}
.batt i{flex:1;border-radius:5px;background:var(--pine2)}.batt i.on{background:var(--sun)}.batt.full i{background:#2fae74}
.batt.full{animation:glow 1.4s ease-in-out infinite alternate}@keyframes glow{to{box-shadow:0 0 0 6px #2fae7433}}
.gift{display:grid;gap:8px;margin-top:10px}.gift .btn{text-align:left}
@media(prefers-reduced-motion:reduce){.batt.full{animation:none}}
@keyframes bob{50%{transform:translateY(-6px)}}.walker{animation:bob 1.6s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.walker{animation:none}}
</style>
</head>
<body>

<!-- 1. 프로필 선택 -->
<section id="vHome">
  <div class="band hero"><div class="wrap">
    <h1>생각의 길</h1>
    <p>하루 15분, 정답 대신 질문으로 배우는 우리 집 AI 스승. 오늘은 누가 걸어볼까요?</p>
    <div class="profiles" id="plist"></div>
    <form class="addf hidden" id="addForm">
      <h3>새 친구 만들기</h3>
      <label>이름 <input id="fName" maxlength="10" required autocomplete="off"></label>
      <label>학년 <select id="fGrade"><option value="1">1학년</option><option value="2">2학년</option><option value="3" selected>3학년</option><option value="4">4학년</option><option value="5">5학년</option><option value="6">6학년</option></select></label>
      <div><span class="muted">내 색깔</span><div class="swatches" id="fColors"></div></div>
      <div class="row"><button class="btn sun" type="submit">만들기</button><button class="btn ghost" type="button" id="addCancel" style="color:inherit">취소</button></div>
    </form>
    <p class="muted" id="storeNote" style="color:#cfe6da;margin-top:18px"></p>
  </div></div>
</section>

<!-- 2. 내 길 (지도 + 오늘의 수업) -->
<section id="vMap" class="hidden">
  <div class="band"><div class="wrap">
    <div class="row" style="justify-content:space-between">
      <h2 id="mHello"></h2>
      <div class="row"><button class="btn ghost small" id="toParent">부모님 기록 보기</button><button class="btn ghost small" id="toHome">친구 바꾸기</button></div>
    </div>
    <div class="mapbox"><svg class="map" id="map" viewBox="0 0 1000 300" role="img" aria-label="24칸 생각의 길 지도"></svg>
      <div class="zones"><div><b>궁금이</b>관찰하고 묻기</div><div><b>생각쟁이</b>생활 속 개념</div><div><b>해결사</b>문제·딜레마</div><div><b>발명가</b>나만의 아이템</div></div>
    </div>
    <div class="today">
      <div class="card">
        <div class="tabs" role="tablist" id="tabs"></div>
        <div id="freeBox" class="hidden" style="margin:0 0 14px"><label>오늘 궁금한 것 <span class="row" style="flex-wrap:nowrap"><input id="freeInp" maxlength="60" placeholder="예: 별은 왜 반짝일까?" style="flex:1"><button class="btn small" id="freeSave" type="button">정하기</button></span></label></div>
        <div id="unitBox" class="hidden" style="margin:0 0 14px"><label>지금 학교에서 배우는 단원 <span class="row" style="flex-wrap:nowrap"><input id="unitInp" list="unitList" placeholder="예: 3-2 수학 분수" style="flex:1"><button class="btn small" id="unitSave" type="button">저장</button></span></label><datalist id="unitList"></datalist></div>
        <span class="tag" id="tStage"></span>
        <h2 id="tTitle" style="margin:10px 0 8px"></h2>
        <p id="tHook" style="margin:0 0 14px"></p>
        <div class="row"><button class="btn sun" id="startBtn">오늘의 수업 시작 (약 15분)</button><span class="muted" id="tNum"></span></div>
        <p class="muted" id="rhythm" style="margin:14px 0 0"></p>
      </div>
      <div class="card">
        <h3>생각 배터리</h3>
        <div class="row" style="margin:8px 0 4px"><div class="batt" id="batt" role="img"></div><span class="jua" id="battNum" style="font-size:20px"></span></div>
        <p class="muted" id="battTxt" style="margin:4px 0 10px"></p><div id="battGift"></div>
        <div id="outfitBox" class="hidden" style="margin-bottom:12px"><h3>나래 선생님 옷</h3><div class="swatches" id="outfits" style="margin-top:8px"></div></div>
        <h3>지난번에 약속한 것</h3>
        <div id="tPrev" class="memo"></div>
        <div id="voiceBox" class="hidden" style="margin-top:16px"><h3>선생님 목소리</h3><div class="row" style="margin-top:8px"><select id="voiceSel" aria-label="선생님 목소리"><option value="buttery">부드러운 목소리</option><option value="airy">산뜻한 목소리</option><option value="glassy">맑은 목소리</option><option value="rounded">포근한 목소리</option><option value="device" id="optDevice">기기 한국어 목소리 (여자)</option></select><button class="btn ghost small" id="voicePrev">미리 듣기</button></div></div>
        <h3 style="margin-top:16px">나의 깨달음 공책</h3>
        <div id="tNotes" class="muted"></div>
      </div>
    </div>
  </div></div>
</section>

<!-- 3. 수업 -->
<section id="vLesson" class="hidden">
  <div class="lesson">
    <div class="lhead">
      <div class="t"><div class="jua" id="lTitle" style="font-size:20px"></div><div class="muted" id="lSub"></div></div>
      <div class="clock"><svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" style="stroke:var(--line)" stroke-width="5"/><circle id="ringArc" cx="18" cy="18" r="15" fill="none" style="stroke:var(--sun)" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 95" transform="rotate(-90 18 18)"/></svg><span id="lClock">0:00</span></div>
    </div>
    <div class="chat" id="chat" aria-live="polite"></div>
    <div class="stage" id="stage">
      <div class="nare-wrap"><svg id="nare" viewBox="0 0 220 290" role="img" aria-label="나래 선생님">
 <ellipse cx="110" cy="282" rx="62" ry="7" fill="#0002"/>
 <g class="wing"><path d="M70 150 C20 120 6 170 28 196 C40 210 62 200 72 186 Z" fill="#fff" stroke="#9fc6e8" stroke-width="3"/><path d="M40 168 C50 176 58 180 68 178 M34 184 C46 190 56 190 66 186" stroke="#9fc6e8" stroke-width="2.5" fill="none"/></g>
 <g class="wing r"><path d="M150 150 C200 120 214 170 192 196 C180 210 158 200 148 186 Z" fill="#fff" stroke="#9fc6e8" stroke-width="3"/><path d="M180 168 C170 176 162 180 152 178 M186 184 C174 190 164 190 154 186" stroke="#9fc6e8" stroke-width="2.5" fill="none"/></g>
 <rect x="84" y="222" width="24" height="54" rx="4" fill="#2f4b6b"/><rect x="112" y="222" width="24" height="54" rx="4" fill="#26405c"/>
 <rect x="80" y="268" width="30" height="12" rx="4" fill="#5a3a22"/><rect x="110" y="268" width="30" height="12" rx="4" fill="#4a2f1b"/>
 <rect x="48" y="146" width="22" height="70" rx="6" style="fill:var(--cg,#f6b81a)"/><rect x="48" y="208" width="22" height="18" rx="5" fill="#f7d2b0"/>
 <rect x="150" y="146" width="22" height="70" rx="6" style="fill:var(--cs,#d99c0c)"/><rect x="150" y="208" width="22" height="18" rx="5" fill="#e9bd98"/>
 <rect x="68" y="140" width="84" height="88" rx="8" style="fill:var(--cg,#f6b81a)"/><rect x="138" y="140" width="14" height="88" rx="6" style="fill:var(--cs,#d99c0c)"/>
 <rect x="100" y="140" width="20" height="88" fill="#ffffff"/><circle cx="110" cy="166" r="3" fill="#1f5a43"/><circle cx="110" cy="186" r="3" fill="#1f5a43"/><circle cx="110" cy="206" r="3" fill="#1f5a43"/>
 <rect x="98" y="128" width="24" height="16" fill="#e9bd98"/>
 <g class="head">
  <rect x="60" y="38" width="100" height="98" rx="12" fill="#f7d2b0"/><rect x="146" y="38" width="14" height="98" rx="8" fill="#e9bd98"/>
  <rect x="56" y="28" width="108" height="32" rx="10" fill="#5a3a22"/><rect x="56" y="46" width="18" height="74" rx="6" fill="#5a3a22"/><rect x="146" y="46" width="18" height="74" rx="6" fill="#4a2f1b"/><rect x="72" y="56" width="58" height="12" rx="5" fill="#5a3a22"/>
  <path d="M134 34 C150 18 170 22 172 30 C162 34 150 40 140 46 Z" fill="#fff" stroke="#9fc6e8" stroke-width="2.5"/>
  <g id="eyes"><rect x="84" y="80" width="11" height="15" rx="3" fill="#14231c"/><rect x="124" y="80" width="11" height="15" rx="3" fill="#14231c"/></g>
  <rect x="78" y="100" width="14" height="8" rx="4" fill="#f29b9b" opacity=".6"/><rect x="128" y="100" width="14" height="8" rx="4" fill="#f29b9b" opacity=".6"/>
  <rect id="mouth" x="100" y="108" width="20" height="6" rx="3" fill="#8a3b2e"/>
 </g>

[0,'과학','아이스크림은 왜 녹을까?','놀이터에서 산 아이스크림이 집에 오기도 전에 줄줄 녹아버렸어요. 겨울엔 안 그랬는데 말이죠.','물질의 상태 변화(고체→액체)와 열','열을 받으면 고체가 액체로 바뀐다는 것을 스스로 설명하기'],
[0,'수학','계단은 모두 몇 칸?','우리 아파트 한 층 계단이 16칸이래요. 엘리베이터가 고장 나서 5층까지 걸어가야 해요.','묶어 세기와 곱셈의 뜻','같은 수씩 묶어 세면 빠르다는 것을 발견하기'],
[0,'생각','좋은 질문 만들기','강아지가 꼬리를 흔들고 있어요. 우리는 이 장면을 보고 어떤 질문을 할 수 있을까요?','사실 질문·이유 질문·상상 질문의 차이','한 장면에서 세 종류의 질문을 직접 만들어 보기'],
[0,'경제','용돈 5,000원의 고민','문구점에서 5,000원으로 스티커(2,000원), 슬라임(4,000원), 연필 세트(3,000원)를 다 사고 싶어요.','한정된 돈과 선택, 포기한 것의 가치(기회비용)','다 가질 수 없을 때 기준을 세워 고르는 법 찾기'],
[0,'과학','아침 그림자, 점심 그림자','아침에 학교 갈 때 내 그림자는 길쭉했는데, 점심시간엔 발밑에 작게 붙어 있었어요.','빛의 직진과 그림자, 해의 높이','해가 높을수록 그림자가 짧아지는 이유 설명하기'],
[0,'사회','줄은 왜 설까?','급식 줄에서 누군가 새치기를 했어요. 다들 기분이 나빴지만 "빨리 먹고 싶어서"라고 해요.','규칙이 필요한 이유와 공정함','규칙이 모두를 지켜 주는 이유를 자기 말로 말하기'],
[1,'수학','피자 8조각, 가족 5명','피자 한 판이 8조각인데 우리 가족은 5명이에요. 어떻게 나누면 모두가 똑같이 먹을까요?','분수: 전체를 똑같이 나눈 것 중의 부분','똑같이 나누기와 분수의 뜻 연결하기'],
[1,'생각','로봇에게 라면 끓이기 시키기','말만 알아듣는 로봇에게 라면 끓이는 법을 알려줘야 해요. 로봇은 말한 것만 정확히 해요.','순서대로 정확히 지시하기(알고리즘)','빠진 단계 없이 순서를 설계하기'],
[1,'수학','1+1은 정말 이득일까?','마트에서 우유 1L는 2,800원, 옆에는 "500mL 두 개 묶음 3,000원"이 있어요.','단위 가격 비교(같은 양으로 맞추기)','같은 양 기준으로 바꿔서 비교하는 습관 만들기'],
[1,'과학','시든 화분 살리기','베란다 화분이 축 처졌어요. 물은 줬는데 왜 그럴까요?','식물이 자라는 데 필요한 것(빛·물·공기·양분)','원인을 하나씩 바꿔 보며 확인하는 생각하기'],
[1,'국어','부모님 설득 작전','이번 주말에 놀이공원에 가고 싶어요. 그냥 "가고 싶어!"라고 하면 안 될 것 같아요.','주장과 근거, 상대의 입장','근거 두 가지와 상대 걱정에 대한 답 준비하기'],
[1,'수학','학교 가는 가장 빠른 길','큰길로 가면 800m, 골목으로 가면 600m인데 골목엔 신호등이 3개 있어요.','거리와 시간, 조건 비교','"가장 빠르다"의 기준을 세워 판단하기'],
[2,'문제해결','무인도 가방 다섯 칸','배가 고장 나 무인도에 가게 됐어요. 가방에는 물건 5개만 넣을 수 있어요.','제약 조건 속 우선순위 정하기','왜 그것이 먼저인지 이유와 함께 순서 정하기'],
[2,'딜레마','반장 선거, 무엇이 공정할까?','후보가 3명인데 1등이 겨우 9표, 나머지가 8표, 7표예요. 반 친구 절반 이상은 1등을 원하지 않았어요.','다수결의 장점과 한계, 공정한 규칙','여러 투표 방법을 비교하고 내 생각 정하기'],
[2,'논리','강 건너기 대작전','농부가 늑대, 염소, 양배추를 데리고 강을 건너야 해요. 배에는 농부와 하나만 탈 수 있어요.','조건을 지키며 단계적으로 문제 풀기','실패한 시도에서 배워 다음 수 고르기'],
[2,'추론','사라진 햄스터 간식','아침에 보니 햄스터 간식 봉지가 비어 있어요. 동생, 고양이, 아빠 중 누구일까요?','증거와 추측의 차이','증거로 말하고, 증거가 부족하면 더 확인할 방법 찾기'],
[2,'과학','우리 집 쓰레기 줄이기 실험','우리 집은 일주일에 쓰레기봉투를 3개나 써요. 정말 줄일 수 있을까요?','가설 세우기와 공정한 실험(바꾸는 것 하나만)','실험 계획을 직접 세워 보기'],
[2,'경제','손님이 줄어든 동네 빵집','단골 빵집에 요즘 손님이 줄었대요. 빵 맛은 그대로라는데 왜일까요?','원인 찾기와 손님의 입장에서 보기','여러 원인을 떠올리고 확인할 방법 정하기'],
[3,'발명','불편함 사냥꾼','집과 학교에서 "아, 불편해!"라고 느낀 순간을 모아 봐요. 발명은 불편함에서 시작해요.','문제 정의: 누가, 언제, 무엇이 불편한가','내 발명 주제가 될 불편함 하나 정하기'],
[3,'발명','누구를 위한 걸까?','내가 고른 불편함을 겪는 사람은 누구일까요? 그 사람은 정말 그게 불편할까요?','사용자 입장에서 생각하기(공감·인터뷰)','가족에게 물어볼 인터뷰 질문 3개 만들기'],
[3,'발명','아이디어 10개, 그리고 1개','불편함을 해결할 방법을 엉뚱한 것까지 잔뜩 떠올린 뒤, 진짜 해볼 하나를 고를 거예요.','많이 떠올리기(발산)와 골라내기(수렴)','고르는 기준을 세워 아이디어 하나 결정하기'],
[3,'발명','종이로 먼저 만들기','진짜 만들기 전에 종이, 상자, 테이프로 먼저 만들어 보면 실수를 미리 찾을 수 있어요.','시제품(프로토타입)과 고쳐 나가기','설계도를 말로 설명하고 시험 방법 정하기'],
[3,'경제','내 발명품, 얼마에 팔까?','내 발명품을 학교 바자회에서 판다면 얼마를 받아야 할까요? 재료비는 얼마였지요?','원가·가격·이익','가격을 정하는 이유를 숫자로 설명하기'],
[3,'말하기','1분 발표 무대','가족 앞에서 내 발명품을 1분 동안 소개해요. 듣는 사람이 "갖고 싶다!"고 느끼게요.','문제→해결→누구에게→왜 좋은가 순서로 말하기','1분 발표 원고를 내 말로 완성하기']
];
// 코넌드럼(정답 없는 문제): [제목, 상황, 반전 카드]
const C=[
['반 회비 10만 원의 주인','우리 반에 쓸 수 있는 돈 10만 원이 생겼어요. 이 돈으로 할 수 있는 건 딱 하나예요. 10만 원으로 반 전체 간식 파티 열기, 10만 원으로 반에서 함께 쓸 보드게임 세트 사기, 10만 원으로 오래 아파서 학교에 못 나온 친구에게 선물 보내기.','알고 보니 예전에 반에서 산 보드게임은 쉬는 시간마다 늘 같은 친구들만 쓰고 있었대요.'],
['빈 땅에 무엇을 지을까?','동네 빈 땅에 놀이터, 주차장, 텃밭 중 딱 하나만 지을 수 있대요. 마을 사람들 생각이 다 달라요.','주차장이 없어서 동네 할머니, 할아버지들이 병원에 가기 무척 힘들다는 이야기를 들었어요.'],
['마지막 아이스크림 하나','냉장고에 아이스크림이 딱 하나 남았는데 삼 남매가 모두 먹고 싶어 해요.','막내가 어제 자기 간식을 형, 누나에게 양보했다는 사실이 밝혀졌어요.'],
['로봇 선생님이 온다면','학교에서 선생님 한 분 대신 화를 절대 안 내고 모르는 게 없는 AI 로봇 선생님을 쓰자고 해요.','로봇 선생님은 친구가 속상해서 울먹이는 걸 잘 알아채지 못한대요.'],
['거짓말이 보이는 안경','쓰기만 하면 상대의 거짓말이 빨간색으로 보이는 안경이 발명됐어요. 모든 사람에게 팔아도 될까요?','이 안경을 쓰면 깜짝 생일 파티 계획이나 선물 비밀도 다 들켜 버려요.'],
['섬마을 다리 놓기','배로 1시간 걸리는 작은 섬과 육지 사이에 다리를 놓자는 의견이 나왔어요. 관광객과 돈이 늘지만 조용한 섬이 시끄러워질 수 있어요.','섬에 사는 아이들은 매일 배를 타고 1시간씩 학교에 다닌대요.'],

function giftCard(p){const box=document.createElement('div');box.className='card';box.style.borderColor='#2fae74';

  if(!p.colorFree)g.append(smallBtn('내 새싹 색을 마음대로 바꾸기','ghost',()=>giveGift(p,'color',box)));

function drawBattery(p){const b=p.battery||0;$('batt').innerHTML=Array.from({length:BMAX},(_,i)=>`<i class="${i<b?'on':''}"></i>`).join('');
  $('batt').classList.toggle('full',b>=BMAX);$('batt').setAttribute('aria-label',`생각 배터리 ${b}/${BMAX}`);$('battNum').textContent=`${b}/${BMAX}`;
  $('battTxt').textContent=b>=BMAX?'가득 찼어요! 선물을 골라요.':`수업을 마칠 때마다 한 칸씩 차요. ${BMAX-b}칸 더 채우면 선물을 골라요.`;
  $('battGift').innerHTML='';if(b>=BMAX)$('battGift').append(giftCard(p));

async function save(){S.ts=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}

const WAITS={1:'빨리 도와주기',2:'보통',3:'넉넉히 기다리기'};
const waitOf=p=>p.wait||2;
function waitRule(p){const w=waitOf(p);
  return w===1?'바로 핵심을 짚는 힌트 한 줄과 더 쉬운 질문 하나를 준다. 두 번 막히면 답에 가까운 큰 힌트로 작은 성공을 먼저 경험하게 한다.'
   :w===3?'바로 돕지 않는다. 먼저 "어디까지 생각했는지" 말하게 하고, 힌트는 아주 작게 3~4번에 나눠 준다. 답에 가까운 힌트는 끝까지 아낀다. 막힌 상태를 견디며 다시 시도한 것 자체를 구체적으로 칭찬한다.'
   :'핵심을 짚는 힌트 한 줄과 더 쉬운 질문 하나를 준다. 두세 번 막히면 조금 더 큰 힌트를 준다.'}
// 수업이 쌓이면 기다림을 한 단계씩 늘림(최근 10번 중 7번 이상 목표 도달). 최근 6번 중 2번 이하면 한 단계 줄여 좌절을 막음.
function growWait(p){if(p.waitAuto===false)return;const ss=(p.sessions||[]).filter(s=>s.at>(p.waitAt||0)),w=waitOf(p);
  const last=n=>ss.slice(-n),ok=a=>a.filter(s=>s.reached).length;
  let nw=w;if(w<3&&ss.length>=10&&ok(last(10))>=7)nw=w+1;else if(w>1&&ss.length>=6&&ok(last(6))<=2)nw=w-1;
  if(nw!==w){p.wait=nw;p.waitAt=Date.now();p.waitLog=[...(p.waitLog||[]),{date:today(),from:w,to:nw}].slice(-20)}}
function level(g){return g<=2?'1~2학년: 아주 쉬운 낱말, 한 문장짜리 질문, 숫자는 20 이하, 손으로 만지고 볼 수 있는 예.':g<=4?'3~4학년: 쉬운 말, 생활 예시 중심, 간단한 곱셈·나눗셈·분수까지.':'5~6학년: 개념 이름도 알려주되 스스로 정의하게 하고, 근거를 두 가지 이상 말하게 하기.'}
function lessonBlock(p,m){
  if(m.track==='talmud')return `[탈무드 하브루타 — 짝과 질문하며 토론하기]
나래 선생님은 오늘 아이의 하브루타 짝이다. 가르치는 사람이 아니라 함께 질문하는 짝처럼 말한다.
이야기 제목: ${m.title}
이야기(아이 눈높이로 생생하게 들려줄 것, 이 내용을 바꾸지 말 것): ${m.hook}

   <p class="muted">${p.grade}학년 · ${kday(a)} ~ ${kday(b)} · 나래 선생님</p>
   <div class="kpis"><div class="kpi"><span class="muted">수업</span><b>${wk.length}회</b></div><div class="kpi"><span class="muted">총 학습</span><b>${wk.reduce((x,s)=>x+(s.minutes||0),0)}분</b></div><div class="kpi"><span class="muted">학습한 날</span><b>${new Set(wk.map(s=>s.date)).size}일</b></div><div class="kpi"><span class="muted">목표 도달</span><b>${wk.filter(s=>s.reached).length}회</b></div></div>
   <p class="muted">교과 탐험 ${cnt('subject')} · 생각의 길 ${cnt('path')} · 코넌드럼 ${cnt('conundrum')} · 더 깊이 ${cnt('deep')} · 자유 탐험 ${cnt('free')} · 탈무드 ${cnt('talmud')} · 선생님 되기 ${cnt('teach')}</p>
   ${wk.length?'':'<p>이번 기간에는 수업 기록이 없어요.</p>'}
   <h3>아이가 직접 쓴 깨달음</h3>${li(wk.filter(s=>s.myWords),s=>`<li>“${esc(s.myWords)}” <span class="muted">— ${esc(s.title)}, ${kday(s.date)}</span></li>`)}
   <h3>잘한 점</h3>${li(wk.filter(s=>s.strength),s=>`<li>${esc(s.strength)}</li>`)}
   <h3>더 다질 점</h3>${li(wk.filter(s=>s.gap),s=>`<li>${esc(s.gap)}</li>`)}
   <h3>문제 해결 걸음</h3><p class="muted">문제 파악 → 방법 떠올리기 → 해 보기 → 다시 보기 중 강한 걸음과 약한 걸음</p>${li(wk.filter(s=>s.steps),s=>`<li>${esc(s.steps)}</li>`)}
   <h3>부모님께 드리는 메모</h3>${li(wk.filter(s=>s.parentNote),s=>`<li>${esc(s.parentNote)}</li>`)}
   <h3>생활 미션</h3>${li(wk.filter(s=>s.homeMission),s=>`<li>${esc(s.homeMission)}</li>`)}
   ${(p.ideas||[]).length?`<h3>아이디어 창고 (최근)</h3><p>${esc(p.ideas.slice(-5).join(' · '))}</p>`:''}
   ${ask?`<h3>주말에 나눌 이야기</h3><div class="ask">${esc(ask)}</div>`:''}`;
  $('rNext').disabled=RW===0}
function routeHash(){if(!LOADED)return;const m=location.hash.match(/^#report-([A-Za-z0-9-]+)$/);if(!m)return;const p=S.profiles.find(x=>x.id===m[1]);if(p&&$('vReport').classList.contains('hidden'))needPin(()=>openReport(p))}
window.addEventListener('hashchange',routeHash);
$('pReport').onclick=()=>openReport(P);
$('rPrev').onclick=()=>{RW++;drawReport(P)};$('rNext').onclick=()=>{if(RW>0){RW--;drawReport(P)}};
$('rBack').onclick=()=>{location.hash='';openMap(P)};
$('rCopy').onclick=()=>{const u=APP_URL+'#report-'+P.id;navigator.clipboard.writeText(u).then(()=>toast('링크를 복사했어요.'),()=>toast(u))};
let DL=null;const loadJs=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.append(s)});
$('rPdf').onclick=async()=>{const b=$('rPdf');b.disabled=true;b.textContent='PDF 만드는 중…';
  try{if(!window.html2pdf)await loadJs('https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js');
    const name=`${P.name}_주간리포트_${$('rSheet').querySelector('p').textContent.split('·')[1].trim().replace(/[^0-9월일~ ]/g,'').replace(/\s+/g,'')}.pdf`;
    const blob=await html2pdf().set({margin:10,image:{type:'jpeg',quality:0.95},html2canvas:{scale:2,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from($('rSheet')).outputPdf('blob');
    await DL.save({filename:name,data:blob});toast('PDF를 저장했어요.')}
  catch(e){toast(e?.code==='declined'?'저장을 취소했어요.':e?.code==='host_unavailable'?'이 앱에서는 저장이 안 돼요. 브라우저나 컴퓨터에서 열어 주세요.':'PDF를 만들지 못했어요. 잠시 뒤 다시 해 주세요.')}
  b.disabled=false;b.textContent='PDF로 저장'};
(async()=>{if(!window.claude?.use)return;DL=await claude.use('downloads');if(DL)$('rPdf').classList.remove('hidden')})();

let LOADED=false;
renderHome();initStore().finally(()=>{LOADED=true;routeHash()}); // 비밀번호는 계정 기록을 다 불러온 뒤에 확인
}
</script>
</body>
</html>
